blueprint:
  name: Gartenbewässerung
  source_url: https://github.com/Tschaegged/gartenbewasserung-blueprint/blob/main/blueprints/automation/gartenbewasserung.yaml
  description: >-
    Bewässert beliebig viele Ventile nacheinander täglich zur eingestellten Zeit.
    Ventile bequem per „Hinzufügen"-Button anlegen – jedes mit optionalem eigenem
    Feuchtigkeitssensor und Schwellwert (Ventil wird übersprungen wenn der Boden
    feucht genug ist). Wettercheck: Regen, Regenwahrscheinlichkeit,
    Temperaturvorhersage und Saisonschaltung. Hitzeschutz: bei sehr hoher
    Tagestemperatur wird unabhängig von der Bodenfeuchtigkeit bewässert.
    Push-Benachrichtigungen bei Abschluss oder übersprungener Bewässerung –
    Titel frei konfigurierbar. Die Abschlussmeldung zeigt korrekt, welche Ventile
    bewässert und welche wegen Bodenfeuchtigkeit übersprungen wurden. In der
    Saisonpause meldet sich das Blueprint wahlweise nie, einmal zu Beginn der
    Pause oder jeden Tag.

  domain: automation
  author: Claude
  input:
    trigger_time_1:
      name: Bewässerungszeit
      description: Uhrzeit für die tägliche Bewässerung (z.B. 06:00)
      selector:
        time: {}
    valves:
      name: Bewässerungsventile
      description: >-
        Ventile in gewünschter Reihenfolge hinzufügen – sie werden nacheinander
        aktiviert. Optional pro Ventil einen Bodenfeuchtigkeitssensor wählen:
        Liegt dessen Wert über dem Schwellwert, wird nur dieses Ventil
        übersprungen.
      selector:
        object:
          label_field: valve
          description_field: moisture_sensor
          multiple: true
          fields:
            valve:
              label: Ventil / Schalter
              required: true
              selector:
                entity:
                  filter:
                  - domain:
                    - switch
                  - domain:
                    - valve
                  multiple: false
            moisture_sensor:
              label: Feuchtigkeitssensor (optional)
              required: false
              selector:
                entity:
                  filter:
                  - domain:
                    - sensor
                    device_class:
                    - moisture
                  multiple: false
            moisture_threshold:
              label: Feuchtigkeitsschwellwert in % (leer = 60)
              required: false
              selector:
                number:
                  min: 0.0
                  max: 100.0
                  step: 5.0
                  unit_of_measurement: '%'
                  mode: slider
    irrigation_duration:
      name: Bewässerungsdauer pro Ventil (Minuten)
      default: 20
      selector:
        number:
          min: 1.0
          max: 120.0
          step: 1.0
          unit_of_measurement: min
          mode: box
    weather_entity:
      name: Wettervorhersage
      description: Wetterentität für Regen- und Temperaturprüfung
      selector:
        entity:
          domain:
          - weather
          reorder: false
          multiple: false
    further_times:
      name: Weitere Bewässerungszeiten
      description: Bis zu 2 zusätzliche Tageszeiten aktivierbar
      icon: mdi:clock-plus-outline
      collapsed: true
      input:
        enable_time_2:
          name: Zweite Bewässerungszeit aktivieren
          default: false
          selector:
            boolean: {}
        trigger_time_2:
          name: Bewässerungszeit 2
          default: '12:00:00'
          selector:
            time: {}
        enable_time_3:
          name: Dritte Bewässerungszeit aktivieren
          default: false
          selector:
            boolean: {}
        trigger_time_3:
          name: Bewässerungszeit 3
          default: '18:00:00'
          selector:
            time: {}
    weather_section:
      name: Wettercheck & Saison
      description: Schwellwerte für Regen, Temperatur und Winterpause
      icon: mdi:weather-partly-cloudy
      collapsed: true
      input:
        forecast_hours:
          name: Regenvorausschau (Stunden)
          description: Wie viele Stunden voraus auf Regen geprüft wird
          default: 12
          selector:
            number:
              min: 1.0
              max: 48.0
              step: 1.0
              unit_of_measurement: h
              mode: slider
        rain_probability_threshold:
          name: Max. Regenwahrscheinlichkeit
          description: Kein Bewässern wenn Regenwahrscheinlichkeit diesen Wert überschreitet
          default: 40
          selector:
            number:
              min: 0.0
              max: 100.0
              step: 5.0
              unit_of_measurement: '%'
              mode: slider
        min_temperature:
          name: Frostschutz – aktuelle Temperatur
          description: Kein Bewässern wenn aktuelle Temperatur unter diesem Wert liegt
          default: 5
          selector:
            number:
              min: -10.0
              max: 20.0
              step: 1.0
              unit_of_measurement: °C
              mode: slider
        min_useful_temperature:
          name: Nutztemperatur – Tagesmaximum
          description: >-
            Kein Bewässern wenn das vorhergesagte Tagesmaximum unter diesem Wert liegt.
            An kalten oder bedeckten Tagen verdunsten Pflanzen wenig. Typisch: 10–15 °C.
          default: 12
          selector:
            number:
              min: 0.0
              max: 30.0
              step: 1.0
              unit_of_measurement: °C
              mode: slider
        season_start_month:
          name: Saisonbeginn (Monat)
          description: 'Bewässerung erst ab diesem Monat aktiv. Standard: April (4)'
          default: 4
          selector:
            number:
              min: 1.0
              max: 12.0
              step: 1.0
              mode: box
        season_end_month:
          name: Saisonende (Monat)
          description: 'Bewässerung bis einschließlich diesem Monat aktiv. Standard: Oktober (10)'
          default: 10
          selector:
            number:
              min: 1.0
              max: 12.0
              step: 1.0
              mode: box
        enable_heat_override:
          name: Hitzeschutz-Bewässerung aktivieren
          description: >-
            Bei sehr hoher Tagestemperatur wird unabhängig von der Bodenfeuchtigkeit
            bewässert – der Feuchtigkeitssensor wird ignoriert.
          default: false
          selector:
            boolean: {}
        heat_temp_threshold:
          name: Hitzeschutz-Temperaturschwelle (°C)
          description: >-
            Liegt das vorhergesagte Tagesmaximum über diesem Wert, wird die
            Bodenfeuchtigkeit ignoriert und immer bewässert.
          default: 30
          selector:
            number:
              min: 20.0
              max: 50.0
              step: 1.0
              unit_of_measurement: °C
              mode: slider
    notify_section:
      name: Benachrichtigungen
      description: Push-Nachrichten an Mobilgeräte senden
      icon: mdi:bell-outline
      collapsed: true
      input:
        notify_devices:
          name: Benachrichtigungsgeräte
          description: Ein oder mehrere Geräte auswählen. Leer lassen für keine Benachrichtigung.
          default: []
          selector:
            device:
              integration: mobile_app
              multiple: true
        notify_on_complete:
          name: Nach Abschluss benachrichtigen
          description: Nachricht senden wenn die Bewässerungsrunde abgeschlossen ist
          default: true
          selector:
            boolean: {}
        notify_on_skip:
          name: Bei übersprungener Bewässerung benachrichtigen
          description: >-
            Nachricht senden, wenn das Wetter die Bewässerung verhindert (Regen,
            Kälte, Frost). Für die Saisonpause gibt es eine eigene Einstellung.
          default: false
          selector:
            boolean: {}
        season_pause_notify:
          name: Benachrichtigung in der Saisonpause
          description: >-
            Außerhalb der Saison läuft die Automation weiter täglich, bewässert aber
            nicht. „Einmal" meldet nur am ersten Tag der Pause, dass die Bewässerung
            bis zum Saisonbeginn ruht. „Jeden Tag" entspricht dem früheren Verhalten.
          default: einmal
          selector:
            select:
              options:
                - label: Nie
                  value: nie
                - label: Einmal am ersten Tag der Pause
                  value: einmal
                - label: Jeden Tag
                  value: taeglich
        notify_title_complete:
          name: Titel – Abschlussnachricht
          description: Titel der Push-Nachricht nach erfolgter Bewässerung
          default: "✅ Gartenbewässerung abgeschlossen"
          selector:
            text: {}
        notify_title_skip:
          name: Titel – Überspringen-Nachricht
          description: Titel der Push-Nachricht wenn die Bewässerung übersprungen wird
          default: "🌿 Gartenbewässerung"
          selector:
            text: {}
variables:
  valves_config: !input valves
  irrigation_duration_val: !input irrigation_duration
  weather_entity: !input weather_entity
  forecast_hours: !input forecast_hours
  rain_probability_threshold: !input rain_probability_threshold
  min_temperature: !input min_temperature
  min_useful_temperature: !input min_useful_temperature
  season_start_month: !input season_start_month
  season_end_month: !input season_end_month
  notify_devices_list: !input notify_devices
  notify_on_complete_val: !input notify_on_complete
  notify_on_skip_val: !input notify_on_skip
  season_pause_notify_val: !input season_pause_notify
  notify_title_complete_val: !input notify_title_complete
  notify_title_skip_val: !input notify_title_skip
  enable_heat_override_val: !input enable_heat_override
  heat_temp_threshold_val: !input heat_temp_threshold
triggers:
- trigger: time
  at: !input trigger_time_1
  id: zeit_1
- trigger: time
  at: !input trigger_time_2
  enabled: !input enable_time_2
  id: zeit_2
- trigger: time
  at: !input trigger_time_3
  enabled: !input enable_time_3
  id: zeit_3
conditions: []
actions:
- variables:
    season_active: '{% set m = now().month %} {% set s = season_start_month | int
      %} {% set e = season_end_month | int %} {{ m >= s and m <= e if s <= e else
      (m >= s or m <= e) }}'
    # War gestern noch Saison, ist heute der erste Tag der Saisonpause.
    season_active_yesterday: '{% set m = (now() - timedelta(days=1)).month %} {%
      set s = season_start_month | int %} {% set e = season_end_month | int %} {{
      m >= s and m <= e if s <= e else (m >= s or m <= e) }}'
    monatsnamen: ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli',
      'August', 'September', 'Oktober', 'November', 'Dezember']
- if:
  - condition: template
    value_template: '{{ not season_active }}'
  then:
  # Saisonpause: je nach Einstellung nie, einmal am ersten Pausentag oder jeden
  # Tag melden. "Einmal" nur beim ersten Zeit-Trigger, damit es bei mehreren
  # Bewaesserungszeiten trotzdem bei einer einzigen Nachricht bleibt.
  - if:
    - condition: template
      value_template: >-
        {{ notify_devices_list | count > 0 and (
             season_pause_notify_val == 'taeglich'
             or (season_pause_notify_val == 'einmal' and season_active_yesterday
                 and trigger.id == 'zeit_1')) }}
    then:
    - action: notify.send_message
      target:
        device_id: !input notify_devices
      data:
        title: '{{ notify_title_skip_val }}'
        message: >-
          {% if season_pause_notify_val == 'einmal' %}Saisonpause: Die Bewässerung
          ruht bis zum Saisonbeginn im {{ monatsnamen[(season_start_month | int) - 1] }}.
          Bis dahin kommen keine weiteren Meldungen.{% else %}Bewässerung übersprungen –
          Saisonpause ({{ monatsnamen[now().month - 1] }}, aktive Saison:
          {{ monatsnamen[(season_start_month | int) - 1] }} bis
          {{ monatsnamen[(season_end_month | int) - 1] }}){% endif %}
  - stop: Saisonpause
- action: weather.get_forecasts
  data:
    type: hourly
  target:
    entity_id: '{{ weather_entity }}'
  response_variable: forecast_response
- variables:
    weather_skip: "{% set forecast = forecast_response[weather_entity]['forecast'][:forecast_hours
      | int] %} {% set ns = namespace(total_rain=0.0, max_prob=0, max_temp=-99.0)
      %} {% for h in forecast %}\n  {% set ns.total_rain = ns.total_rain + (h.precipitation
      | default(0) | float) %}\n  {% set ns.max_prob = [ns.max_prob, h.precipitation_probability
      | default(0) | int] | max %}\n  {% set ns.max_temp = [ns.max_temp, h.temperature
      | default(-99) | float] | max %}\n{% endfor %} {% set condition = states(weather_entity)
      %} {% set current_temp = state_attr(weather_entity, 'temperature') | float(99)
      %} {{ ns.total_rain > 0\n   or ns.max_prob > rain_probability_threshold | int\n
      \  or condition in ['rainy', 'pouring', 'lightning', 'lightning-rainy', 'hail',
      'snowy-rainy']\n   or current_temp < min_temperature | float\n   or ns.max_temp
      < min_useful_temperature | float }}\n"
    weather_skip_reason: "{% set forecast = forecast_response[weather_entity]['forecast'][:forecast_hours
      | int] %} {% set ns = namespace(total_rain=0.0, max_prob=0, max_temp=-99.0)
      %} {% for h in forecast %}\n  {% set ns.total_rain = ns.total_rain + (h.precipitation
      | default(0) | float) %}\n  {% set ns.max_prob = [ns.max_prob, h.precipitation_probability
      | default(0) | int] | max %}\n  {% set ns.max_temp = [ns.max_temp, h.temperature
      | default(-99) | float] | max %}\n{% endfor %} {% set condition = states(weather_entity)
      %} {% set current_temp = state_attr(weather_entity, 'temperature') | float(99)
      %} {% if ns.total_rain > 0 %}Regen vorhergesagt ({{ '%.1f' | format(ns.total_rain)
      }} mm) {% elif ns.max_prob > rain_probability_threshold | int %}Hohe Regenwahrscheinlichkeit
      ({{ ns.max_prob }}%) {% elif condition in ['rainy', 'pouring', 'lightning',
      'lightning-rainy', 'hail', 'snowy-rainy'] %}Aktuell Niederschlag {% elif current_temp
      < min_temperature | float %}Zu kalt – Frostschutz ({{ current_temp }}°C) {%
      elif ns.max_temp < min_useful_temperature | float %}Tagesmaximum zu niedrig
      ({{ '%.1f' | format(ns.max_temp) }}°C) {% else %}Wetter ungünstig {% endif
      %}\n"
    heat_override: "{% if not enable_heat_override_val %}false{% else %}{% set forecast
      = forecast_response[weather_entity]['forecast'][:forecast_hours | int] %}{% set
      ns = namespace(max_temp=-99.0) %}{% for h in forecast %}{% set ns.max_temp =
      [ns.max_temp, h.temperature | default(-99) | float] | max %}{% endfor %}{{
      ns.max_temp > heat_temp_threshold_val | float }}{% endif %}"
- if:
  - condition: template
    value_template: '{{ weather_skip }}'
  then:
  - if:
    - condition: template
      value_template: '{{ notify_on_skip_val and notify_devices_list | count > 0 }}'
    then:
    - action: notify.send_message
      target:
        device_id: !input notify_devices
      data:
        title: '{{ notify_title_skip_val }}'
        message: Bewässerung übersprungen – {{ weather_skip_reason | trim }}
  - stop: Wetter ungünstig
- if:
  - condition: template
    value_template: '{{ valves_config is not iterable or valves_config is string
      or valves_config | count == 0 }}'
  then:
  - stop: Keine Ventile konfiguriert
- variables:
    pre_watered_list: "{% set ns = namespace(names=[]) %} {% for item in valves_config
      %}\n  {% set sensor = item.get('moisture_sensor') | default('', true) %}\n
      \ {% set threshold = item.get('moisture_threshold') | float(60) %}\n  {% set
      ok = heat_override | bool or sensor == '' or states(sensor) | float(0) < threshold
      %}\n  {% set name = state_attr(item.valve, 'friendly_name') | default(item.valve)
      %}\n  {% if ok %}{% set ns.names = ns.names + [name] %}{% endif %}\n{% endfor
      %} {{ ns.names | join(', ') }}\n"
    pre_skipped_list: "{% set ns = namespace(names=[]) %} {% for item in valves_config
      %}\n  {% set sensor = item.get('moisture_sensor') | default('', true) %}\n
      \ {% set threshold = item.get('moisture_threshold') | float(60) %}\n  {% set
      ok = heat_override | bool or sensor == '' or states(sensor) | float(0) < threshold
      %}\n  {% set name = state_attr(item.valve, 'friendly_name') | default(item.valve)
      %}\n  {% if not ok %}{% set ns.names = ns.names + [name ~ ' (Boden feucht genug)']
      %}{% endif %}\n{% endfor %} {{ ns.names | join(', ') }}\n"
- repeat:
    for_each: '{{ valves_config }}'
    sequence:
    - variables:
        current_valve: '{{ repeat.item.valve }}'
        current_sensor: "{{ repeat.item.get('moisture_sensor') | default('', true) }}"
        current_threshold: "{{ repeat.item.get('moisture_threshold') | float(60) }}"
        moisture_ok: "{{ heat_override | bool or current_sensor == '' or\n   states(current_sensor)
          | float(0) < current_threshold }}\n"
    - if:
      - condition: template
        value_template: '{{ moisture_ok }}'
      then:
      - action: homeassistant.turn_on
        target:
          entity_id: '{{ current_valve }}'
      - delay:
          minutes: '{{ irrigation_duration_val | int }}'
      - action: homeassistant.turn_off
        target:
          entity_id: '{{ current_valve }}'
- if:
  - condition: template
    value_template: '{{ notify_on_complete_val and notify_devices_list | count > 0 }}'
  then:
  - variables:
      completion_message: "{% set ns2 = namespace(parts=[]) %} {% if pre_watered_list
        | trim %}\n  {% set ns2.parts = ns2.parts + ['Bewässert: ' ~ pre_watered_list
        | trim ~ ' – je ' ~ irrigation_duration_val ~ ' Min.'] %}\n{% endif %} {%
        if pre_skipped_list | trim %}\n  {% set ns2.parts = ns2.parts + ['Übersprungen:
        ' ~ pre_skipped_list | trim] %}\n{% endif %} {{ ns2.parts | join('\\n') }}\n"
  - action: notify.send_message
    target:
      device_id: !input notify_devices
    data:
      title: '{{ notify_title_complete_val }}'
      message: '{{ completion_message | trim }}'
mode: single
max_exceeded: silent
